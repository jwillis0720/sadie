# Human reference for G3-Germlines parity testing with MAXIMUM MIXED SOURCES
# This file tests that alleles from different providers (IMGT, OGRDB, VDJbase)
# produce identical annotation results when sequences are the same.
#
# All shared alleles are split evenly between OGRDB and VDJbase.
# Only alleles not available in OGRDB/VDJbase (or with different sequences) use IMGT.
#
# Distribution:
#   - OGRDB: 57 alleles (heavy chain V/D/J + some kappa/lambda)
#   - VDJbase: 53 alleles (heavy chain V + kappa/lambda)
#   - IMGT: 22 alleles (constant regions + unavailable alleles)
#
# All cross-source alleles have IDENTICAL sequences to IMGT.
human:
  ogrdb:
    human:
      # Heavy chain D genes
      - IGHD1-1*01
      - IGHD1-7*01
      - IGHD2-2*01
      - IGHD2-8*01
      - IGHD3-10*01
      - IGHD3-22*01
      - IGHD3-3*01
      - IGHD3-9*01
      - IGHD4-17*01
      - IGHD5-12*01
      - IGHD6-13*01
      - IGHD7-27*01
      # Heavy chain J genes (IGHJ4*02 moved to vdjbase due to IgBLAST alignment edge case)
      - IGHJ1*01
      - IGHJ2*01
      - IGHJ3*02
      - IGHJ5*02
      - IGHJ6*02
      # Heavy chain V genes
      - IGHV1-18*01
      - IGHV1-2*02
