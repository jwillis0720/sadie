name: CI
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main', 'update_doc', 'development']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1 ncbi-blast+
      - name: Install dependencies
        run: |
          pip install poetry wheel
          poetry install --with dev
      - name: PreCommit
        if: matrix.python-version == '3.14'
        uses: pre-commit/action@v3.0.1
      - name: Unit Testing
        run: poetry run pytest -xsv tests/unit
      - name: Integration Testing
        run: poetry run pytest -xv tests/integration
      - name: Static Type Check
        if: matrix.python-version == '3.14'
        run: poetry run pyright

  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1 ncbi-blast+
      - name: Install dependencies
        run: |
          pip install poetry wheel
          poetry install --with dev
      - name: Test with pytest-cov
        env:
          PYTHONFAULTHANDLER: 1
          PYTHONMALLOC: malloc
        run: |
          poetry run pytest -xsv tests/unit/ \
            --cov=sadie \
            --cov-report=html:coverage/reports/html \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-config=pyproject.toml
      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: ./coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
