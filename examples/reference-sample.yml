# SADIE Multi-Source Reference Configuration Sample
# =================================================
# This file demonstrates how to configure germline databases from multiple sources.
#
# YAML Structure:
#   name:              # Reference database name (used in Airr)
#     source:          # Provider: imgt, ogrdb, vdjbase, or custom
#       species:       # Species name
#         - GENE*01    # List of gene alleles
#
# Available Sources:
#   - imgt:    IMGT reference database (most comprehensive)
#   - ogrdb:   Open Germline Receptor Database (curated alleles)
#   - vdjbase: VDJbase curated germlines
#   - custom:  Your own custom sequences (see docs/germlines/custom-sequences.md)
#
# Build Command:
#   sadie reference build reference-sample.yml --output ./my-db
#
# Or use existing command:
#   sadie reference make --reference reference-sample.yml --outpath ./my-db

# Example 1: Mouse germlines from IMGT
mouse-imgt:
  imgt:
    mouse:
      # V genes - Variable region
      - IGHV1-4*01
      - IGHV1-5*01
      - IGHV1-9*01
      - IGHV1-12*01
      - IGHV1-18*01
      - IGHV5-6*01
      - IGHV5-9*01
      # D genes - Diversity region
      - IGHD1-1*01
      - IGHD2-3*01
      - IGHD2-4*01
      - IGHD3-1*01
      - IGHD4-1*01
      # J genes - Joining region
      - IGHJ1*01
      - IGHJ2*01
      - IGHJ3*01
      - IGHJ4*01
      # Light chain kappa
      - IGKV1-110*01
      - IGKV3-1*01
      - IGKJ1*01
      - IGKJ2*01

# Example 2: Human germlines from OGRDB (curated alleles)
human-ogrdb:
  ogrdb:
    human:
      # V genes
      - IGHV1-2*02
      - IGHV1-18*01
      - IGHV1-69*01
      - IGHV3-23*01
      - IGHV3-30*01
      - IGHV4-34*01
      - IGHV4-59*01
      # D genes
      - IGHD3-10*01
      - IGHD3-22*01
      - IGHD6-13*01
      # J genes
      - IGHJ4*02
      - IGHJ5*02
      - IGHJ6*02
      # Light chains
      - IGKV1-39*01
      - IGKV3-20*01
      - IGKJ1*01
      - IGKJ4*01

# Example 3: Rhesus macaque subset from VDJbase
macaque-vdjbase:
  vdjbase:
    rhesus_macaque:
      # V genes
      - IGHV1-1*01
      - IGHV3-1*01
      - IGHV4-1*01
      # D genes
      - IGHD1-1*01
      - IGHD2-1*01
      # J genes
      - IGHJ1*01
      - IGHJ4*01

# Example 4: Combined multi-source for human (advanced)
# Demonstrates mixing sources for a single reference
human-multi:
  imgt:
    human:
      # Baseline from IMGT
      - IGHV1-2*02
      - IGHV3-23*01
      - IGHD3-10*01
      - IGHJ4*02
      - IGKV1-39*01
      - IGKJ1*01
  ogrdb:
    human:
      # Additional curated alleles from OGRDB
      - IGHV1-69*01
      - IGHV4-34*01
